[package]
name = "desktop-learning-agent"
version = "0.1.0"
description = "Tauri shell for the Desktop Learning Agent"
authors = ["Desktop Learning Agent"]
edition = "2021"

[lib]
name = "desktop_learning_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.5.0", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8.0", features = [] }
