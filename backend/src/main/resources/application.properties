quarkus.application.name=learn-agent-backend
quarkus.http.host=127.0.0.1
quarkus.http.port=10707
quarkus.http.cors.enabled=true
quarkus.http.cors.origins=http://127.0.0.1:1420,http://localhost:1420,http://tauri.localhost,https://tauri.localhost,tauri://localhost
learn-agent.data-dir=${user.home}/.learn-agent
learn-agent.memory-enabled=true
quarkus.datasource.db-kind=sqlite
quarkus.datasource.jdbc.url=jdbc:sqlite:${learn-agent.data-dir}/db/learn-agent.db
quarkus.datasource.jdbc.max-size=5
%test.learn-agent.data-dir=target/test-data
