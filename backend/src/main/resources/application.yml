spring:
  application:
    name: desktop-learning-agent-backend
  main:
    web-application-type: reactive
  sql:
    init:
      mode: never
  ai:
    model:
      chat: openai
      embedding: none
      image: none
      moderation: none
      audio:
        speech: none
        transcription: none
    openai:
      base-url: ${OPENAI_BASE_URL:https://api.openai.com}
      api-key: ${OPENAI_API_KEY:}
      chat:
        model: ${OPENAI_MODEL:gpt-4.1-mini}

server:
  address: 127.0.0.1
  port: 18080

app:
  data-dir: ${AGENT_DATA_DIR:${user.home}/.desktop-learning-agent}
  database: ${APP_DATABASE:${app.data-dir}/agent.db}
  user-id: desktop-user
  app-name: desktop-learning-agent
