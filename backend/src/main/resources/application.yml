spring:
  application:
    name: learning-agent-java-backend
  main:
    web-application-type: reactive
  sql:
    init:
      mode: never
server:
  address: 127.0.0.1
  port: 18080

app:
  openai:
    base-url: ${OPENAI_BASE_URL:https://api.openai.com}
    api-key: ${OPENAI_API_KEY:}
    model: ${OPENAI_MODEL:gpt-4.1-mini}
  data-dir: ${AGENT_DATA_DIR:${user.home}/.learning-agent-java}
  database: ${APP_DATABASE:${app.data-dir}/agent.db}
  user-id: desktop-user
  app-name: learning-agent-java
